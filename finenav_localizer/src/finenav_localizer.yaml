finenav_localizer:
  passthrough: {
    type: bool,
    default_value: false,
    description: "If true, bypass ESKF and output latest Pose/Twist directly (Zero calculation)",
  }
  update_rate_hz: {
    type: double,
    default_value: 100.0,
    description: "Timer frequency [Hz] for the ESKF update loop",
    validation: {
      bounds<>: [1.0, 1000.0]
    }
  }
  max_delay_sec: {
    type: double,
    default_value: 0.5,
    description: "Maximum tolerable observation delay [s]",
    validation: {
      bounds<>: [0.0, 5.0]
    }
  }
  max_dt_sec: {
    type: double,
    default_value: 0.5,
    description: "Upper bound clamp for dt [s]",
    validation: {
      bounds<>: [0.001, 5.0]
    }
  }
  max_pose_queue_size: {
    type: int,
    default_value: 64,
    description: "Pose observation queue capacity",
    validation: {
      bounds<>: [1, 1024]
    }
  }
  max_twist_queue_size: {
    type: int,
    default_value: 64,
    description: "Twist observation queue capacity",
    validation: {
      bounds<>: [1, 1024]
    }
  }
  max_rel_pose_queue_size: {
    type: int,
    default_value: 64,
    description: "Relative-pose observation queue capacity",
    validation: {
      bounds<>: [1, 1024]
    }
  }
  force_2d_mode: {
    type: bool,
    default_value: false,
    description: "If true, constrain z, roll, and pitch to zero via per-tick virtual observations (uses fixed internal covariances)",
  }
  publish_tf: {
    type: bool,
    default_value: false,
    description: "Whether to broadcast the map->base_link TF transform on each filter update tick",
  }
  publish_odom: {
    type: bool,
    default_value: false,
    description: "Publish the ESKF estimated state as nav_msgs/Odometry on '~/nav_state'",
  }
  max_consecutive_empty_ticks: {
    type: int,
    default_value: 10,
    description: "Max consecutive empty ticks before freezing the filter",
    validation: {
      bounds<>: [1, 100000]
    }
  }
  model:
    pos_noise_std: {
      type: double,
      default_value: 0.03,
      description: "Unmodeled position process noise std [m/√s] (prevents cov collapse)",
      validation: {
        bounds<>: [0.0, 100.0]
      }
    }
    rot_noise_std: {
      type: double,
      default_value: 0.01,
      description: "Unmodeled rotation process noise std [rad/√s] (prevents yaw cov collapse)",
      validation: {
        bounds<>: [0.0, 100.0]
      }
    }
    vel_noise_std: {
      type: double,
      default_value: 0.05,
      description: "Linear velocity process noise std [m/s/√s]",
      validation: {
        bounds<>: [0.000001, 100.0]
      }
    }
    omega_noise_std: {
      type: double,
      default_value: 0.03,
      description: "Angular velocity process noise std [rad/s/√s]",
      validation: {
        bounds<>: [0.000001, 100.0]
      }
    }



