# Conservative XY footprint of the simulator robot, including all four wheels.
# Body: 0.60 x 0.40 m. Wheel centers: x = +/-0.20, y = +/-0.25 m.
# Each wheel has radius 0.15 m and axial width 0.10 m, hence the outer bounds
# are x = +/-0.35 and y = +/-0.30 m.
robot:
  kinematics: diff
  length: 0.7
  width: 0.6
  name: diff_0p7x0p6

train:
  direct_train: true
  data_size: 100000
  data_range: [-10, -10, 10, 10]
  batch_size: 256
  epoch: 5000
  valid_freq: 250
  save_freq: 250
  lr: 5e-5
  lr_decay: 0.5
  decay_freq: 1500
