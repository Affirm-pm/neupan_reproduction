map_server:
  update_rate_hz:
    type: double
    default_value: 10.0
    description: "Sensor fusion update rate (Hz)"
    validation:
      gt<>: [0.0]
  shift_rate_hz:
    type: double
    default_value: 50.0
    description: "Map window shift check rate (Hz)"
    validation:
      gt<>: [0.0]
  shift_margin_ratio:
    type: double
    default_value: 0.5
    description: "Distance-from-centre ratio triggering a window shift (0 = centre only, 1 = at edge)"
    validation:
      bounds<>: [0.0, 1.0]
