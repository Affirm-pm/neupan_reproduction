smooth_path:
  data_weight:
    type: double
    default_value: 0.2
    description: "Data-term weight; larger keeps the smoothed path closer to the original."
  smooth_weight:
    type: double
    default_value: 0.3
    description: "Smoothing-term weight; larger makes the curve smoother."
  tolerance:
    type: double
    default_value: 0.0001
    description: "Convergence tolerance; iteration stops once the total per-iteration displacement is below this."
    validation:
      gt<>: [0.0]
  max_iterations:
    type: int
    default_value: 1000
    description: "Maximum number of smoothing iterations."
    validation:
      gt<>: [0]
