# SimpleWorldView parameter definition.
#
# Every WorldView has parameters, exactly like every Planner and every Map.
# The top-level key MUST equal the first argument of FINENAV_REGISTER_WORLDVIEW
# (`dummy_world_view` below) — the framework builds this WorldView's
# ParamListener under that name, so the key and the registration name are one
# and the same string.
#
# The framework calls SimpleWorldView::configure() once at startup (YAML defaults
# or --params-file overrides) and again on every `ros2 param set`, because
# `prepare_log_period` is hot-reloadable (no read_only flag).  Add
# `read_only: true` to a parameter whose change would require rebuilding
# internal data structures — then configure() only runs once, at startup.
dummy_world_view:
  prepare_log_period:
    type: int
    default_value: 100
    description: "Log a prepare() heartbeat every N plans (0 = never)."
    validation:
      gt<>: [-1]
