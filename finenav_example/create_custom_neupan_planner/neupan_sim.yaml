# ==============================================================================
#  NeuPAN plugin — simulation configuration (fine_simulator / lio_type:=static)
# ==============================================================================
#
#  Used TOGETHER with getting_started/params/sim_localizer.yaml, which sets
#  use_sim_time and configures the localizer + navigator:
#
#    ros2 run finenav_example hello_finenav --ros-args \
#      --params-file FineNav-Engine/finenav_example/getting_started/params/sim_localizer.yaml \
#      --params-file FineNav-Engine/finenav_example/create_custom_neupan_planner/neupan_sim.yaml
#
#  The node key is /<engine node>/<layer name>: the plugin parameters are
#  declared on the ControlLayer's PRIVATE node, whose full name is
#  /hello_finenav/my_layer (engine node name becomes its namespace, the layer
#  name becomes its node name).  "my_layer" is the layer name main.cpp uses.
# ==============================================================================

hello_finenav:
  my_layer:
    ros__parameters:

      neupan_planner:
        # The simulator body's XY size is 0.6 x 0.4 m, but its four wheels
        # extend the outer XY bounds to 0.7 x 0.6 m
        # (finenav_simulator/resource/robot/model.sdf.xmacro). These two MUST
        # equal the footprint the loaded DUNE model was trained with: libneupan
        # compares them at load time and throws on a mismatch.
        #
        # The plugin's build-time default is diff_0p7x0p6.bin — a DUNE
        # trained for exactly this footprint (see the NEUPAN_DEFAULT_CHECKPOINT
        # comment in CMakeLists.txt) — so model and values agree.  If you swap in
        # another model, export it with upstream's tools/export_dune_weights.py,
        # passing the same <length> <width>, and update these two to match.
        robot_length: 0.7
        robot_width: 0.6

        # The default 4.0 m/s is far too fast for this robot in a small maze.
        ref_speed: 0.6
        approach_speed_gain: 0.4
        approach_min_speed: 0.05

        # Finish yaw after reaching the terminal position. These tolerances
        # stay below the navigator's 0.25 m / 0.1 rad success tolerances.
        goal_xy_tolerance: 0.15
        goal_yaw_tolerance: 0.05
        goal_yaw_gain: 1.5
        goal_yaw_max_speed: 0.6
        goal_yaw_min_speed: 0.12

        # ── Clearance / avoidance weights (upstream's `adjust` block) ──────
        #
        # These four must be tuned together.  The parameter-library defaults
        # (d_max 1.0, ro_obs 400) are sized for a large robot in open space;
        # on this 0.7 x 0.6 m footprint inside a 0.4 m-thick maze they make the QP
        # oscillate: the clearance reward (eta * d, capped by d_max) keeps
        # asking for 1 m of free space the maze cannot provide, while ro_obs
        # 400 punishes every constraint violation enormously — so the solver
        # flips between "follow the reference" and "escape the wall" on every
        # control cycle.  Measured with the defaults: the linear-velocity
        # command changed sign on ~40 % of cycles (min -0.69 m/s), net speed
        # ~0.02 m/s — the robot visibly stutters forward/backward.
        #
        # The values below are the ones neupan_cpp ships and validates for the
        # 0.5 x 0.5 m sentry robot (neupan_cpp_ros/config/sentry_diff.yaml, and
        # libneupan/tools/ab_configs/upstream_margins.yaml); they are the right
        # scale for a robot this size.  Measured with them: 0 sign changes,
        # steady ~0.6 m/s forward, goal reached.
        d_max: 0.3
        d_min: 0.05
        ro_obs: 10.0
        bk: 0.0

        # Hard-stop gate: stop when the planned clearance drops below this [m].
        #
        # It MUST stay below d_min above, and that is not a stylistic point.  The
        # optimizer is allowed - and rewarded - to bring the planned clearance
        # down to d_min, and the DUNE estimate min_distance comes from lands a few
        # millimetres either side of it.  With the gate equal to d_min the planner
        # therefore trips its OWN emergency stop the moment it reaches the
        # clearance it was told to keep; and because the gate commands zero
        # velocity and never steers away, the robot is then frozen beside the
        # obstacle for good.  Measured with gate 0.05 / d_min 0.05: "closest
        # obstacle 0.048 m is below collision_threshold 0.050 m" on repeat, pose
        # frozen to 1e-3 m for minutes, and no recovery could free it.
        #
        # 0.02 leaves room for that estimation error and still catches a real
        # violation.  Do not raise it towards d_min.
        collision_threshold: 0.02

      neupan_world_view:
        # The simulator's point_cloud_converter_node publishes the obstacle
        # cloud here.  With lio_type != fast_lio it already transforms the cloud
        # into base_link and removes the robot's self-returns, which is exactly
        # what this view wants — hence points_type point_cloud2 and an empty
        # points_frame (use the message header).
        #
        # Do NOT point this at /livox/lidar: that is the raw cloud in the Gazebo
        # sensor frame, before self-filtering.
        points_topic: "/cloud_for_lio"
        points_type: "point_cloud2"
        points_frame: ""

        # Range gate around the robot [m].  The lower bound hides the robot's
        # own body; the upper bound keeps the point count (and DUNE's
        # decimation) meaningful.
        scan_range_min: 0.4
        scan_range_max: 6.0

        # The filter that makes a 3D lidar usable by a 2D planner: the robot's
        # gpu_lidar spans -0.23 .. +1.57 rad vertically, so beyond ~1.7 m every
        # ray hits the floor and would read as a ring of obstacles.  Keeping
        # world-frame z in [0.15, 2.0] drops the floor and keeps the walls.
        #
        # Raise max_height on the uneven worlds (map_hill, map_vocano) and on
        # anything with a ceiling you do NOT want treated as an obstacle.
        min_height: 0.15
        max_height: 2.0

        points_timeout: 0.5
