nav_state_manager:
  goal_tolerance: {
    type: double,
    default_value: 0.25,
    description: "Distance threshold [m] to declare goal reached",
    validation: {
      bounds<>: [0.01, 10.0]
    }
  }
  stuck_dist_threshold: {
    type: double,
    default_value: 0.05,
    description: "Minimum displacement [m] within the stuck window to not be considered stuck",
    validation: {
      bounds<>: [0.001, 1.0]
    }
  }
  stuck_timeout_s: {
    type: double,
    default_value: 5.0,
    description: "Duration [s] without sufficient movement before declaring STUCK",
    validation: {
      bounds<>: [0.5, 60.0]
    }
  }
  localization_cov_threshold: {
    type: double,
    default_value: 5.0,
    description: "Trace of position covariance above which LOCALIZATION_ERROR is triggered",
    validation: {
      bounds<>: [0.01, 1000.0]
    }
  }
  localization_stale_timeout_s: {
    type: double,
    default_value: 1.0,
    description: "Maximum age [s] of localizer output before triggering LOCALIZATION_ERROR",
    validation: {
      bounds<>: [0.1, 30.0]
    }
  }
  monitor_rate_hz: {
    type: double,
    default_value: 10.0,
    description: "Frequency [Hz] of the internal FSM monitor timer",
    validation: {
      bounds<>: [1.0, 200.0]
    }
  }

