# DummyPlanner parameter definition.
#
# These parameters are hot-reloadable (no read_only flag).
# The framework will call DummyPlanner::configure() both at startup and on every
# `ros2 param set` via the AlgoConfigurator callback.
#
# Write your param definition YAML, then register with:
#   FINENAV_REGISTER_ALGO_CONFIG(YourPlanner, your_planner)
# in the header file.
dummy_planner:
  linear_speed:
    type: double
    default_value: 0.5
    description: "Forward speed (m/s)"
    validation:
      gt<>: [0.0]
  angular_speed:
    type: double
    default_value: 1.0
    description: "Angular speed (rad/s)"
    validation:
      gt<>: [0.0]
