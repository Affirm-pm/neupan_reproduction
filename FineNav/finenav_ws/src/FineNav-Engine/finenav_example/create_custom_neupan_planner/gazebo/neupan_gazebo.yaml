/**:
  ros__parameters:
    use_sim_time: true
/hello_finenav:
  ros__parameters:
    world_view: neupan_world_view
    behavior_tree: NeuPANNavigate
/hello_finenav/finenav_localizer:
  ros__parameters:
    pose_topic: /localization_pose
    pose_smoothing_time: 0.0
    initial_pose_topic: /initialpose
    odom_topic: ""
    odom_use_twist: false
    twist_topic: /simulation/measured_twist
    force_2d_mode: true
    publish_tf: false
    publish_odom: true
/hello_finenav/finenav_navigator:
  ros__parameters:
    behavior_trees:
      - finenav_example/getting_started/behavior_trees
      - finenav_example/create_custom_neupan_planner/behavior_trees
/hello_finenav/my_layer:
  ros__parameters:
    neupan_planner:
      config_file: $(find-pkg-share finenav_example)/create_custom_neupan_planner/planner.yaml
      model_file: $(find-pkg-share finenav_example)/create_custom_neupan_planner/models/diff_0p7_0p6.bin
      robot_height: 0.6
    neupan_world_view:
      max_height: 0.6
