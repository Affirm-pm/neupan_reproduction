finenav_localizer:

  # ── Pose channel — absolute pose, EMA-smoothed ─────────────────────────

  pose_topic: {
    type: string,
    default_value: "",
    read_only: true,
    description: "PoseWithCovarianceStamped topic (absolute pose; empty = disabled)"
  }
  pose_smoothing_time: {
    type: double,
    default_value: 0.0,
    description: "Pose convergence time [s]. 0.0 = instant / jump to target, 0.5 = converge within ~500 ms",
    validation: { bounds<>: [0.0, 10.0] }
  }
  initial_pose_topic: {
    type: string,
    default_value: "/initialpose",
    read_only: true,
    description: "One-shot topic to set initial pose (feeds Pose channel once, then unsubscribes)"
  }

  # ── Twist channel — body-frame velocity: integrates pose + sets velocity ─

  twist_topic: {
    type: string,
    default_value: "",
    read_only: true,
    description: "TwistWithCovarianceStamped topic (integrates position + sets velocity; empty = disabled)"
  }

  # ── Odometry — composite input ─────────────────────────────────────────
  #
  #  odom.pose is always used for RelPose frame-to-frame integration.
  #
  #  odom_use_twist: whether to use odom.twist to set velocity
  #    true  — directly set state velocity from odom.twist
  #    false — ignore odom.twist (default; may be all zeros)

  odom_topic: {
    type: string,
    default_value: "",
    read_only: true,
    description: "Odometry topic (empty = disabled)"
  }
  odom_use_twist: {
    type: bool,
    default_value: false,
    read_only: true,
    description: "Whether to use odometry twist data to set state velocity"
  }

  # ── State history ──────────────────────────────────────────────────────
  #
  #  How far back a stamped query may reach: getRobotState(stamp) resolves a
  #  past timestamp from the retained window, and every consumer that
  #  back-dates to its measurement stamp fails when the state is gone —
  #  the pose channel above falls back to the latest odometry, map-side
  #  observation sources drop the message.
  #
  #  Size it for the slowest back-dated source: its period plus scan /
  #  processing / transport latency (a 0.5 Hz pose channel spends 2 s per
  #  period alone).

  state_history_duration: {
    type: double,
    default_value: 5.0,
    description: "Retained robot-state history window [s]; how far back a stamped query may reach (0 = keep only the latest sample)",
    validation: { bounds<>: [0.0, 60.0] }
  }

  # ── Output ─────────────────────────────────────────────────────────────

  force_2d_mode: {
    type: bool,
    default_value: false,
    description: "Constrain z, roll, and pitch to zero in output state (reloadable)"
  }
  publish_tf: {
    type: bool,
    default_value: false,
    read_only: true,
    description: "Broadcast map->base_link TF transform"
  }
  publish_odom: {
    type: bool,
    default_value: false,
    read_only: true,
    description: "Publish the estimated state as nav_msgs/Odometry on '~/nav_state'"
  }
