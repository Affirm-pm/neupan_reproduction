name: CI

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run --Werror

  libneupan:
    # The core library alone, as a plain CMake project.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libeigen3-dev \
            libyaml-cpp-dev libgtest-dev
          .github/scripts/install_osqp.sh
      - name: Build
        run: |
          cmake -S libneupan -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  ros2:
    # Both packages with colcon, including the headless ROS scenario tests.
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/neupan_cpp
      - name: Dependencies
        shell: bash
        run: |
          apt-get update
          src/neupan_cpp/.github/scripts/install_osqp.sh
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
