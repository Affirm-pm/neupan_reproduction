# route.yaml - RoutePathSearch 参数定义
route_planner:
  path_density:
    type: double
    default_value: 0.05
    description: "Interpolation step (m) for densifying the route output path"
  min_approach_angle_deg:
    type: double
    default_value: 0.0
    description: "Minimum angle (degrees) between approach direction and path tangent for path-point snapping. Candidates with smaller angles are rejected to avoid perpendicular connector paths. For a smooth merge, set to e.g. 120.0 (approach from behind the path direction). Set to 0.0 to disable."
